name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - coding-agent
          - indexer-service
          - proxy-service
          - reviewer-agent

    name: ${{ matrix.service }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -e "${{ matrix.service }}"

      - name: Lint
        run: pylint ${{ matrix.service }}

      - name: Test
        working-directory: ${{ matrix.service }}
        run: pytest

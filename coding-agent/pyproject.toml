[project]
name = "coding-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "aiokafka>=0.12",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "langchain>=0.3",
    "langchain-anthropic>=0.3",
    "langfuse>=2.0",
    "gitpython>=3.1",
    "PyJWT>=2.8",
    "httpx>=0.27",
    "cryptography>=42.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Additional LLM providers
openai = ["langchain-openai>=0.2"]
mistral = ["langchain-mistralai>=0.2"]
yandex = ["langchain-community>=0.3"]
all-llms = [
    "langchain-openai>=0.2",
    "langchain-mistralai>=0.2",
    "langchain-community>=0.3",
]